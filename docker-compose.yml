services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windsight-backend
    ports:
      - "8000:8000"
    environment:
      - ELEXON_API_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - DEFAULT_CUTOFF_TIME=11:00:00
      - DEFAULT_DECISION_MONTH=2026-01
      - CACHE_ENABLED=true
    volumes:
      - backend_cache:/app/cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windsight-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_cache:
